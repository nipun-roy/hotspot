<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCafe WiFi Hotspot | নেটক্যাফে ওয়াইফাই</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 16px;
            color: #1e293b;
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 410px;
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top decorative accent bar with NetCafe brand colors */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #dc2626 100%);
        }

        .logo-container {
            margin: 0 auto 12px auto;
            max-width: 220px;
        }

        .logo-img {
            max-width: 100%;
            height: auto;
            max-height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .tagline-en {
            font-size: 13px;
            font-style: italic;
            color: #1e3a8a;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .slogan-bn {
            display: inline-block;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: #dc2626;
            font-size: 13.5px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin: 10px 0 20px 0;
            border: 1px solid #fecaca;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 22px;
        }

        .feature-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 4px;
            font-size: 11px;
            color: #475569;
            font-weight: 600;
        }

        .feature-item span {
            display: block;
            font-size: 15px;
            margin-bottom: 3px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .flag-prefix {
            position: absolute;
            left: 14px;
            font-size: 16px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #475569;
            font-weight: 600;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px 14px 14px 50px;
            font-size: 17px;
            font-weight: 600;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            outline: none;
            transition: all 0.25s ease;
            color: #0f172a;
            letter-spacing: 1px;
            background: #ffffff;
        }

        input[type="tel"]:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #dc2626 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(30, 58, 138, 0.35);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(220, 38, 38, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message-box {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.45;
            text-align: left;
        }

        .message-box.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message-box.success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .card-footer {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
            color: #64748b;
        }

        .card-footer strong {
            color: #1e3a8a;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Brand Logo -->
    <div class="logo-container">
        <img src="logo.jpg" alt="NetCafe Logo" class="logo-img" onerror="this.src='../logo.jpg'" />
        <div class="tagline-en">the network is the business</div>
    </div>

    <!-- Brand Slogan -->
    <div class="slogan-bn">
        গতির সাথে কোনো আপোষ নয়
    </div>

    <!-- Network Features Badge -->
    <div class="features-grid">
        <div class="feature-item">
            <span>⚡</span> হাই-স্পিড
        </div>
        <div class="feature-item">
            <span>🔒</span> নিরাপদ
        </div>
        <div class="feature-item">
            <span>🌐</span> আনলিমিটেড
        </div>
    </div>

    <!-- Registration & Login Form -->
    <form id="loginForm" onsubmit="handleNetCafeLogin(event)">
        <div class="form-group">
            <label for="phone">মোবাইল নম্বর লিখুন (১১ ডিজিট):</label>
            <div class="input-wrapper">
                <span class="flag-prefix">🇧🇩</span>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="01XXXXXXXXX" 
                    maxlength="11" 
                    required 
                    autocomplete="tel"
                />
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">কানেক্ট করুন / Connect WiFi</span>
        </button>
    </form>

    <!-- Feedback Message Box -->
    <div id="msgBox" class="message-box"></div>

    <div class="card-footer">
        Powered by <strong>NetCafe Network</strong> | High-Speed WiFi Zone
    </div>
</div>

<!-- MikroTik Standard Hidden Form for Final Login -->
<form name="login" action="$(link-login-only)" method="post" style="display:none;">
    <input type="hidden" name="username" id="mt_user" />
    <input type="hidden" name="password" id="mt_pass" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
</form>

<script>
    // Vercel Serverless API Endpoint
    const VERCEL_API_URL = "https://netcafe-hotspots.vercel.app/api/register";
    const clientMac = "$(mac)";

    async function handleNetCafeLogin(e) {
        e.preventDefault();

        const phoneInput = document.getElementById('phone');
        const phone = phoneInput.value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const msgBox = document.getElementById('msgBox');

        // বাংলাদেশি ১১ ডিজিট মোবাইল নম্বর ভ্যালিডেশন
        const bdRegex = /^01[3-9]\d{8}$/;
        if (!bdRegex.test(phone)) {
            showMessage('অনুগ্রহ করে সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 017XXXXXXXX)', 'error');
            phoneInput.focus();
            return;
        }

        // বাটন লোডিং স্টেট
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.innerText = 'কানেক্ট করা হচ্ছে...';
        msgBox.style.display = 'none';

        try {
            const response = await fetch(VERCEL_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phone: phone,
                    mac: clientMac
                })
            });

            const data = await response.json();

            if (data.success && data.username && data.password) {
                showMessage(data.message || 'স্বাগতম! আপনার ইন্টারনেট কানেক্ট হচ্ছে...', 'success');

                // MikroTik ফর্মে ক্রেডেনশিয়াল বসিয়ে সাবমিট করা
                document.getElementById('mt_user').value = data.username;
                document.getElementById('mt_pass').value = data.password;

                setTimeout(() => {
                    document.forms['login'].submit();
                }, 1000);

            } else {
                showMessage(data.message || 'সার্ভারে সমস্যা হয়েছে। পুনরায় চেষ্টা করুন।', 'error');
                resetButton();
            }

        } catch (err) {
            console.error('API Error:', err);
            showMessage('সার্ভারের সাথে যোগাযোগ করা যায়নি। অনুগ্রহ করে কিছুক্ষণ পর চেষ্টা করুন।', 'error');
            resetButton();
        }
    }

    function showMessage(text, type) {
        const msgBox = document.getElementById('msgBox');
        msgBox.innerText = text;
        msgBox.className = 'message-box ' + type;
    }

    function resetButton() {
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = 'কানেক্ট করুন / Connect WiFi';
    }
</script>

</body>
</html>
